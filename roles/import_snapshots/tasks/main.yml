- name: Read snapshots resource file
  os_migrate.os_migrate.read_resources:
    path: "{{ os_migrate_data_dir }}/snapshots.yml"
  register: read_snapshots

- name: Include the conversion hosts inventory
  ansible.builtin.include_role:
    name: os_migrate.os_migrate.conversion_host
    tasks_from: conv_hosts_inventory.yml

- name: Filter snapshots to import
  ansible.builtin.set_fact:
    filtered_snapshots: "{{ (read_snapshots.resources
      | from_yaml
      | os_migrate.os_migrate.stringfilter(os_migrate_snapshots_import_filter,
       attribute='params.name')) }}"

- name: Create directory for snapshot migration logs
  ansible.builtin.file:
    path: "{{ os_migrate_data_dir }}/volume_logs"
    state: directory
    mode: '0750'

- name: Check data copy state and run conversion host operations
  ansible.builtin.include_role:
    name: os_migrate.os_migrate.conversion_host
    tasks_from: conv_host_details.yml

- name: Import snapshots
  ansible.builtin.include_tasks: import_snapshot.yml
  loop: "{{ filtered_snapshots }}"
  loop_control:
    loop_var: snapshot_resource
